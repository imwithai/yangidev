{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-white">Kategoriyalar</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% for category in categories %}
        <a href="{% url 'category-detail' category.slug %}" class="card p-6 flex flex-col justify-between hover:border-zinc-600 transition-colors">
            <div>
                <h3 class="text-xl font-bold text-white mb-2">{{ category.name }}</h3>
                <p class="text-zinc-400 text-sm mb-4">{{ category.courses.count }} ta kurs</p>
            </div>
        </a>
        {% empty %}
        <div class="col-span-full text-center py-12 text-zinc-500">
            Hali kategoriyalar mavjud emas.
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
