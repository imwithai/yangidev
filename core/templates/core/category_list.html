{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-white">Kategoriyalar</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% for category in categories %}
        <a href="{% url 'category-detail' category.slug %}" class="card p-8 flex flex-col justify-between opacity-0 animate-fade-in-up group" style="animation-delay: {{ forloop.counter0 }}00ms;">
            <div>
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-white mb-2 group-hover:text-blue-400 transition-colors">{{ category.name }}</h3>
                <p class="text-zinc-400 font-medium">{{ category.courses.count }} ta kurs</p>
            </div>
        </a>
        {% empty %}
        <div class="col-span-full text-center py-12 text-zinc-500">
            Hali kategoriyalar mavjud emas.
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
