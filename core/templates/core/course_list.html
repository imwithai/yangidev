{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-white">Barcha Kurslar</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        {% for course in courses %}
        <div class="card group block flex flex-col justify-between opacity-0 animate-fade-in-up" style="animation-delay: {{ forloop.counter0 }}00ms;">
            <a href="{% url 'course-detail' course.pk %}" class="block h-full">
                <div class="relative aspect-video overflow-hidden bg-zinc-800">
                    {% if course.cover_image %}
                    <img src="{{ course.cover_image.url }}" alt="{{ course.title }}" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500">
                    {% else %}
                    <div class="w-full h-full flex items-center justify-center text-zinc-600">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    {% endif %}
                </div>
                <div class="p-5">
                    <div class="inline-block px-2.5 py-1 bg-zinc-800 rounded text-xs font-medium text-zinc-400 mb-3">
                        {{ course.category.name }}
                    </div>
                    <h3 class="text-xl font-bold text-white group-hover:text-blue-400 transition-colors line-clamp-2 mb-3">
                        {{ course.title }}
                    </h3>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="col-span-full text-center py-12 text-zinc-500">
            Hali kurslar mavjud emas.
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
