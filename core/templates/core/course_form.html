{% extends 'core/base.html' %}
{% block content %}
<h2>{% if object %}Edit Course{% else %}Add Course{% endif %}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'course-list' %}">Cancel</a>
{% endblock %}
