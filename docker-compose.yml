services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=yangidev
      - POSTGRES_USER=yangidev
      - POSTGRES_PASSWORD=yangidev
    ports:
      - "5432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 yangidev.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=yangidev
      - POSTGRES_USER=yangidev
      - POSTGRES_PASSWORD=yangidev
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=prod-secret-key-change-me
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      - db

volumes:
  postgres_data:
